# Candidate only. Install after reviewing current Omarchy HOOKS; not applied here.
# Preserve Omarchy hooks/modules/files and insert a build-only hook after plymouth.
_pf_hooks=()
_pf_plymouth=0
_pf_encrypt=0
for _pf_hook in "${HOOKS[@]}"; do
    [[ $_pf_hook == plymouth-fallback ]] && continue
    _pf_hooks+=("$_pf_hook")
    if [[ $_pf_hook == plymouth ]]; then
        _pf_plymouth=1
        _pf_hooks+=(plymouth-fallback)
    fi
    [[ $_pf_hook == encrypt ]] && _pf_encrypt=1
done
if (( !_pf_plymouth || !_pf_encrypt )); then
    error 'plymouth-fallback: expected the reviewed plymouth + encrypt boot chain'
    exit 1
fi
HOOKS=("${_pf_hooks[@]}")
unset _pf_hooks _pf_hook _pf_plymouth _pf_encrypt
