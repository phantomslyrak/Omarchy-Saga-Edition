<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Initramfs only. No user directories, root-system includes or host caches. -->
  <dir>/usr/share/fonts/plymouth-fallback</dir>
  <cachedir>/run/fontconfig</cachedir>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias><family>Sans</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
